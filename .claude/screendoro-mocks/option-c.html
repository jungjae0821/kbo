<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>C 글러브 가죽</title>
<link rel="stylesheet" href="base.css">
<style>
  /* 글러브 가죽: 가운데 정렬된 가는 제목, 열을 "성적"과 "팀 기록"으로 묶은 표. 가죽 갈색 하나만 승률과 시작 버튼에 */
  :root { --bg: #E8EBEE; --surface: #FFFFFF; --ink: #2A2320; --sub: #5F5650; --shade: #F5F2EF; --accent: #7A3E1D; }
  body { background: #CDD2D7; color: var(--ink); }
  .phone { background: var(--bg); }

  header { text-align: center; padding: 20px 20px 0; }
  h1 { margin: 0; font-size: 24px; font-weight: 300; letter-spacing: -0.03em; }
  h1 b { font-weight: 700; }
  .me { margin: 10px auto 0; display: grid; grid-template-columns: repeat(3, 1fr); width: 100%; min-height: 52px; background: var(--surface); border-radius: 14px; padding: 6px 4px; color: var(--sub); font-family: '경기천년바탕', sans-serif; font-size: 12px; }
  .me span + span { border-left: 1px solid #ECE7E3; }
  .me strong { display: block; color: var(--ink); font-family: '경기천년제목', sans-serif; font-size: 17px; }
  .me:hover { background: #FBFAF9; }

  .resume { margin: 8px 20px 0; display: flex; align-items: center; justify-content: center; gap: 12px; font-size: 13px; }
  .resume p { margin: 0; }
  .resume button { height: 44px; padding: 0 14px; border-radius: 22px; background: transparent; color: var(--accent); font-weight: 700; font-size: 14px; }
  .resume button:hover { background: rgba(122, 62, 29, 0.08); }

  section { margin: 12px 10px 0; }
  h2 { margin: 0 0 4px; text-align: center; font-size: 15px; font-weight: 700; }
  .grp th { height: 22px; font-size: 11px; font-weight: 700; color: var(--accent); }
  thead tr:last-child th { height: 30px; font-size: 11px; font-weight: 500; color: var(--sub); line-height: 1.15; }
  tbody td, tbody th { height: 37px; font-size: 13px; background: var(--surface); }
  tbody tr:nth-child(even) td, tbody tr:nth-child(even) th { background: var(--shade); }
  tbody tr:first-child td:first-child { border-top-left-radius: 12px; }
  tbody tr:first-child td:last-child { border-top-right-radius: 12px; }
  tbody tr:last-child td:first-child { border-bottom-left-radius: 12px; }
  tbody tr:last-child td:last-child { border-bottom-right-radius: 12px; }
  tbody .c-rank { font-family: '경기천년제목', sans-serif; font-weight: 700; }
  tbody .c-team { font-weight: 700; font-size: 14px; }
  tbody .c-pct { color: var(--accent); font-family: '경기천년제목', sans-serif; font-weight: 700; }
  /* 성적 묶음과 팀 기록 묶음 사이만 띄운다 */
  .c-avg { border-left: 6px solid var(--bg); }

  .dock { margin-top: auto; padding-left: 20px; padding-right: 20px; }
  .start { width: 100%; height: 56px; border-radius: 28px; background: var(--accent); color: #fff; font-size: 17px; font-weight: 700; }
  .start:hover { background: #643218; }
  .start:active { background: #4F2713; }
  button:focus-visible { outline: 3px solid var(--ink); outline-offset: 2px; }
</style>
</head>
<body>
<div class="phone">
  <main>
    <header>
      <h1>KBO <b>가상야구</b></h1>
      <button class="me" type="button" aria-label="내 기록 보기: 0경기, 적중률 없음, 0점"><span><strong>0</strong>경기</span><span><strong>-</strong>적중률</span><span><strong>0</strong>점</span></button>
    </header>
    <div class="resume">
      <p>KT 대 삼성, 5회초에서 멈춘 경기</p>
      <button type="button">이어하기</button>
    </div>
    <section aria-labelledby="st">
      <h2 id="st">2026 정규시즌 순위</h2>
      <div id="tbl"></div>
    </section>
  </main>
  <div class="dock"><button class="start" type="button">시뮬레이션 시작</button></div>
</div>
<script src="data.js"></script>
<script>
  renderTable(document.getElementById('tbl'));
  // 열 묶음 줄: 성적(승률~무) / 팀 기록(타율, 평균자책)
  const thead = document.querySelector('#tbl thead');
  thead.insertAdjacentHTML('afterbegin', '<tr class="grp"><th colspan="2"></th><th colspan="6" scope="colgroup">성적</th><th colspan="2" scope="colgroup" class="c-avg">팀 기록</th></tr>');
</script>
</body>
</html>
