<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>A 등번호</title>
<link rel="stylesheet" href="base.css">
<style>
  /* 등번호: 유니폼 등번호처럼 순위 숫자를 크게 세워 첫눈에 순서가 읽히게 한다. 청록 하나만 승률과 시작 버튼에 */
  :root { --bg: #F3F5F7; --surface: #FFFFFF; --ink: #1B2230; --sub: #566173; --line: #E8ECF0; --accent: #0B6B66; --accentSoft: #DDEFED; }
  body { background: #DCE1E6; color: var(--ink); }
  .phone { background: var(--bg); }

  header { padding: 22px 20px 0; }
  h1 { margin: 0; font-size: 21px; font-weight: 700; letter-spacing: -0.02em; }
  .me { margin-top: 6px; min-height: 44px; padding: 0; background: none; display: flex; gap: 16px; align-items: center; color: var(--sub); font-family: '경기천년바탕', sans-serif; font-size: 14px; }
  .me strong { color: var(--ink); font-family: '경기천년제목', sans-serif; font-size: 16px; margin-right: 2px; }
  .me .more { margin-left: auto; color: var(--accent); font-family: '경기천년제목', sans-serif; font-weight: 500; font-size: 14px; }
  .me:hover .more { opacity: 0.75; }

  .resume { margin: 6px 12px 0; display: flex; align-items: center; gap: 10px; background: var(--accentSoft); border-radius: 12px; padding: 8px 8px 8px 14px; }
  .resume p { margin: 0; flex: 1; font-size: 13px; line-height: 1.45; }
  .resume button { height: 44px; padding: 0 16px; border-radius: 10px; background: var(--surface); color: var(--accent); font-weight: 700; font-size: 14px; }
  .resume button:hover { background: #F4FBFA; }

  .board { margin: 14px 12px 0; background: var(--surface); border-radius: 16px; padding: 4px 4px 2px; }
  h2 { margin: 0; padding: 12px 10px 4px; font-size: 15px; font-weight: 700; }
  thead th { height: 32px; font-size: 11px; font-weight: 500; color: var(--sub); line-height: 1.15; }
  tbody tr + tr td, tbody tr + tr th { border-top: 1px solid var(--line); }
  tbody td, tbody th { height: 38px; font-size: 13px; }
  tbody .c-rank { font-family: '경기천년제목', sans-serif; font-weight: 700; font-size: 19px; letter-spacing: -0.03em; }
  tbody .c-team { text-align: left; font-weight: 700; font-size: 14px; padding-left: 2px; }
  thead .c-team { text-align: left; padding-left: 2px; }
  tbody .c-pct { color: var(--accent); font-family: '경기천년제목', sans-serif; font-weight: 700; font-size: 14px; }

  .dock { margin-top: auto; }
  .start { width: 100%; height: 56px; border-radius: 14px; background: var(--accent); color: #fff; font-size: 17px; font-weight: 700; }
  .start:hover { background: #095A56; }
  .start:active { background: #074845; }
  button:focus-visible { outline: 3px solid var(--ink); outline-offset: 2px; }
</style>
</head>
<body>
<div class="phone">
  <main>
    <header>
      <h1>KBO 가상야구</h1>
      <button class="me" type="button" aria-label="내 기록 보기: 0경기, 적중률 없음, 0점"><span><strong>0</strong>경기</span><span>적중률 <strong>-</strong></span><span><strong>0</strong>점</span><span class="more">내 기록</span></button>
    </header>
    <div class="resume">
      <p>KT 대 삼성, 5회초에서 멈춘 경기</p>
      <button type="button">이어하기</button>
    </div>
    <section class="board" aria-labelledby="st">
      <h2 id="st">2026 정규시즌 순위</h2>
      <div id="tbl"></div>
    </section>
  </main>
  <div class="dock"><button class="start" type="button">시뮬레이션 시작</button></div>
</div>
<script src="data.js"></script>
<script>renderTable(document.getElementById('tbl'));</script>
</body>
</html>
