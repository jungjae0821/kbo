<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>B 중계 자막</title>
<link rel="stylesheet" href="base.css">
<style>
  /* 중계 자막: TV 중계 화면의 남색 자막 띠. 띠 위에 내 기록, 띠에 걸친 이어하기, 아래는 줄무늬 표. 자홍 하나만 승률과 시작 버튼에 */
  :root { --bg: #FFFFFF; --band: #1F2459; --bandSub: #C5C8EE; --ink: #1A1C2E; --sub: #575B72; --stripe: #F2F3F9; --accent: #B8175A; }
  body { background: #D9DBE6; color: var(--ink); }
  .phone { background: var(--bg); }

  header { background: var(--band); color: #fff; padding: 22px 18px 40px; }
  h1 { margin: 0; font-size: 20px; font-weight: 700; letter-spacing: -0.01em; }
  .me { margin-top: 8px; min-height: 44px; padding: 0; background: none; display: flex; gap: 18px; align-items: baseline; color: var(--bandSub); font-family: '경기천년바탕', sans-serif; font-size: 13px; width: 100%; text-align: left; }
  .me strong { color: #fff; font-family: '경기천년제목', sans-serif; font-size: 18px; margin-right: 3px; }
  .me .more { margin-left: auto; color: #fff; font-family: '경기천년제목', sans-serif; font-weight: 500; font-size: 13px; }
  .me:hover .more { opacity: 0.75; }

  /* 띠 경계에 걸쳐 띄운다: 잠깐 나타나는 알림이라는 높이 차이를 그림자로 */
  .resume { margin: -28px 14px 0; position: relative; display: flex; align-items: center; gap: 10px; background: #fff; border-radius: 10px; padding: 8px 8px 8px 14px; box-shadow: 0 6px 16px rgba(20, 24, 70, 0.16); }
  .resume p { margin: 0; flex: 1; font-size: 13px; line-height: 1.45; }
  .resume button { height: 44px; padding: 0 16px; border-radius: 8px; background: var(--band); color: #fff; font-weight: 700; font-size: 14px; }
  .resume button:hover { background: #2C3277; }

  h2 { margin: 16px 18px 4px; font-size: 15px; font-weight: 700; }
  .tbl { padding: 0 8px; }
  thead th { height: 30px; font-size: 11px; font-weight: 500; color: var(--sub); line-height: 1.15; }
  thead th.c-pct { color: var(--accent); }
  tbody td, tbody th { height: 38px; font-size: 13px; }
  tbody tr:nth-child(odd) td, tbody tr:nth-child(odd) th { background: var(--stripe); }
  tbody tr td:first-child { border-radius: 8px 0 0 8px; }
  tbody tr td:last-child { border-radius: 0 8px 8px 0; }
  tbody .c-rank { font-family: '경기천년제목', sans-serif; font-weight: 500; color: var(--sub); }
  tbody .c-team { text-align: left; font-weight: 700; font-size: 14px; }
  thead .c-team { text-align: left; }
  tbody .c-pct { color: var(--accent); font-family: '경기천년제목', sans-serif; font-weight: 700; }

  .dock { margin-top: auto; }
  .start { width: 100%; height: 56px; border-radius: 10px; background: var(--accent); color: #fff; font-size: 17px; font-weight: 700; }
  .start:hover { background: #9C134C; }
  .start:active { background: #82103F; }
  button:focus-visible { outline: 3px solid #E9A400; outline-offset: 2px; }
</style>
</head>
<body>
<div class="phone">
  <main>
    <header>
      <h1>KBO 가상야구</h1>
      <button class="me" type="button" aria-label="내 기록 보기: 0경기, 적중률 없음, 0점"><span><strong>0</strong>경기</span><span>적중률 <strong>-</strong></span><span><strong>0</strong>점</span><span class="more">내 기록</span></button>
    </header>
    <div class="resume">
      <p>KT 대 삼성, 5회초에서 멈춘 경기</p>
      <button type="button">이어하기</button>
    </div>
    <section aria-labelledby="st">
      <h2 id="st">2026 정규시즌 순위</h2>
      <div class="tbl" id="tbl"></div>
    </section>
  </main>
  <div class="dock"><button class="start" type="button">시뮬레이션 시작</button></div>
</div>
<script src="data.js"></script>
<script>renderTable(document.getElementById('tbl'));</script>
</body>
</html>
