<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>B 맞대결 카드</title>
<style>
  @font-face { font-family: '경기천년제목'; src: url('fonts/GyeonggiTitle-Bold.ttf'); font-weight: 700; }
  @font-face { font-family: '경기천년제목'; src: url('fonts/GyeonggiTitle-Medium.ttf'); font-weight: 500; }
  @font-face { font-family: '경기천년제목'; src: url('fonts/GyeonggiTitle-Light.ttf'); font-weight: 300; }
  @font-face { font-family: '경기천년바탕'; src: url('fonts/GyeonggiBatang-Regular.ttf'); font-weight: 400; }
  @font-face { font-family: '경기천년바탕'; src: url('fonts/GyeonggiBatang-Bold.ttf'); font-weight: 700; }
  :root { --bg: #E2E5EA; --plum: #4B1D2F; --plum2: #64293F; --bone: #F3EFEA; --boneSub: #D8C7CC; --ink: #20161B; --sub: #5A4F55; --mustard: #E0AE2F; }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: transparent; }
  body { display: flex; gap: 24px; font-family: '경기천년바탕', 'Pretendard', system-ui, sans-serif; color: var(--ink); word-break: keep-all; font-size: 14px; line-height: 1.5; }
  .t { font-family: '경기천년제목', 'Pretendard', system-ui, sans-serif; }
  .phone { position: relative; width: 360px; height: 740px; background: var(--bg); border-radius: 28px; overflow: hidden; }
  .bar { display: flex; justify-content: space-between; align-items: center; padding: 16px 20px 0; font-size: 13px; color: var(--sub); }
  .bar .t { font-size: 15px; font-weight: 500; color: var(--ink); }
  .btn { position: absolute; left: 16px; bottom: 18px; height: 56px; border: 0; border-radius: 28px; background: var(--mustard); color: var(--ink); font-family: '경기천년제목', sans-serif; font-size: 17px; font-weight: 700; }
  .btn.main { right: 112px; }
  .btn.sub { left: auto; right: 16px; width: 88px; background: #CDD2D9; font-weight: 500; font-size: 15px; }

  /* 홈 */
  .hello { padding: 22px 20px 0; }
  .hello h1 { margin: 0; font-size: 30px; font-weight: 300; letter-spacing: -0.02em; line-height: 1.25; }
  .hello h1 b { font-weight: 700; }
  .deck { position: relative; height: 330px; margin: 22px 16px 0; }
  .card { position: absolute; border-radius: 22px; padding: 20px; color: var(--bone); }
  .card.back { inset: 26px 18px 0 18px; background: var(--plum2); }
  .card.front { inset: 0 0 26px 0; background: var(--plum); }
  .card .k { color: var(--boneSub); font-size: 13px; }
  .card .big { font-family: '경기천년제목', sans-serif; font-size: 64px; font-weight: 700; line-height: 1; margin: 10px 0 4px; }
  .card .row { display: grid; grid-template-columns: repeat(4, 1fr); margin-top: 22px; }
  .card .row b { display: block; font-family: '경기천년제목', sans-serif; font-size: 20px; }
  .card .row span { color: var(--boneSub); font-size: 12px; }
  .card .last { position: absolute; left: 20px; right: 20px; bottom: 20px; display: flex; justify-content: space-between; color: var(--boneSub); font-size: 13px; }
  .card .last b { color: var(--bone); font-weight: 700; }
  .note { padding: 18px 20px 0; color: var(--sub); font-size: 13px; }

  /* 경기 */
  .strip { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; padding: 14px 20px 0; }
  .strip .tm { font-family: '경기천년제목', sans-serif; font-size: 14px; font-weight: 500; }
  .strip .tm b { display: block; font-size: 40px; font-weight: 700; line-height: 1.05; }
  .strip .hm { text-align: right; }
  .strip .mid { text-align: center; font-size: 13px; color: var(--sub); }
  .strip .mid b { display: block; font-family: '경기천년제목', sans-serif; color: var(--ink); font-size: 16px; }
  .face { position: relative; height: 410px; margin: 14px 16px 0; }
  .pc { position: absolute; left: 0; top: 0; width: 230px; height: 196px; background: var(--bone); color: var(--ink); border-radius: 22px; padding: 18px; }
  .bt { position: absolute; right: 0; bottom: 0; width: 250px; height: 220px; background: var(--plum); color: var(--bone); border-radius: 22px; padding: 18px; }
  .role { font-size: 13px; color: var(--sub); }
  .bt .role { color: var(--boneSub); }
  .nm { font-family: '경기천년제목', sans-serif; font-size: 32px; font-weight: 700; line-height: 1.15; margin-top: 2px; }
  .team { font-size: 13px; }
  .st { display: grid; grid-template-columns: repeat(3, 1fr); margin-top: 16px; }
  .st b { display: block; font-family: '경기천년제목', sans-serif; font-size: 19px; font-weight: 700; }
  .st span { font-size: 12px; color: var(--sub); }
  .bt .st span { color: var(--boneSub); }
  .vs { position: absolute; left: 100px; top: 206px; font-family: '경기천년제목', sans-serif; font-weight: 300; font-size: 34px; color: var(--sub); }
  .sit { position: absolute; left: 0; bottom: 0; width: 80px; }
  .bases { position: relative; width: 70px; height: 70px; }
  .bases i { position: absolute; width: 20px; height: 20px; transform: rotate(45deg); background: #C3C8D0; border-radius: 4px; }
  .bases i.on { background: var(--plum); }
  .b2 { left: 25px; top: 4px; } .b1 { left: 46px; top: 25px; } .b3 { left: 4px; top: 25px; }
  .sit p { margin: 4px 0 0; font-size: 12px; color: var(--sub); line-height: 1.4; }
  .last-pa { position: absolute; left: 20px; right: 20px; top: 590px; font-size: 13px; color: var(--sub); }
  .last-pa b { color: var(--ink); }
</style>
</head>
<body>
  <section class="phone" aria-label="홈">
    <div class="bar"><span class="t">KBO 가상야구</span><span>2026 기록 기반</span></div>
    <div class="hello"><h1 class="t">오늘은<br><b>어느 팀</b>에 걸까요</h1></div>
    <div class="deck">
      <div class="card back"></div>
      <div class="card front">
        <div class="k">내 점수</div>
        <div class="big">0</div>
        <div class="row">
          <div><b>1</b><span>예측</span></div>
          <div><b>0</b><span>적중</span></div>
          <div><b>1</b><span>빗나감</span></div>
          <div><b>.000</b><span>적중률</span></div>
        </div>
        <div class="last"><span>지난 경기 KT 9 : 2 삼성</span><b>삼성 예측, 빗나감</b></div>
      </div>
    </div>
    <p class="note">맞히면 100점, 무승부는 0점이고 적중률에서 빠집니다.</p>
    <button class="btn main">두 팀 고르기</button><button class="btn sub">기록</button>
  </section>

  <section class="phone" aria-label="경기 진행">
    <div class="bar"><span class="t">‹ 가상 경기</span><span>내 예측 삼성 승리</span></div>
    <div class="strip">
      <div class="tm">KT 위즈<b>7</b></div>
      <div class="mid"><b>5회말</b>2아웃</div>
      <div class="tm hm">삼성 라이온즈<b>0</b></div>
    </div>
    <div class="face">
      <div class="pc">
        <div class="role">투수</div>
        <div class="nm">소형준</div>
        <div class="team">KT 위즈</div>
        <div class="st"><div><b>3.15</b><span>평균자책</span></div><div><b>1.20</b><span>WHIP</span></div><div><b>106</b><span>탈삼진</span></div></div>
      </div>
      <div class="vs">대</div>
      <div class="bt">
        <div class="role">타자, 오늘 세 번째 타석</div>
        <div class="nm">박승규</div>
        <div class="team">삼성 라이온즈</div>
        <div class="st"><div><b>.265</b><span>타율</span></div><div><b>13</b><span>홈런</span></div><div><b>.842</b><span>OPS</span></div></div>
      </div>
      <div class="sit"><div class="bases" aria-label="1·2루 주자"><i class="b2 on"></i><i class="b1 on"></i><i class="b3"></i></div><p>1루 디아즈<br>2루 류지혁</p></div>
    </div>
    <p class="last-pa">방금 <b>디아즈 단타</b>, 류지혁 2루로</p>
    <button class="btn main">던지기</button><button class="btn sub">끝까지</button>
  </section>
</body>
</html>
